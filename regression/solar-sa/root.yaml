      src_comp: DataForSolar
      src_intent: internal
      dst_name: QS
      dst_comp: SOLAR
    - src_name: QG
      src_comp: DataForSolar
      src_intent: internal
      dst_name: QG
      dst_comp: SOLAR
    - src_name: RL
      src_comp: DataForSolar
      src_intent: internal
      dst_name: RL
      dst_comp: SOLAR
