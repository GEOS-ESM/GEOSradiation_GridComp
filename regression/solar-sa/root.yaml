---
mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp
    userRoutine: setservices_

  geometry:
    esmf_geom:
      class: CubedSphere
      im_world: 12
    vertical_grid:
      class: model
      standard_name: air_pressure
      units: hPa
      num_levels: 181
      field_edge: PLE
      field_center: PE

  children:
    DataForSolar:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-solar.yaml

    SOLAR:
      dso: libGEOSradiation_GridComp.so
      setservices: solar_setservices_
      config_file: solar.yaml

    FakeGOCART:
      dso: libFakeGOCART_GridComp.so
      setservices: fakegocart_setservices_
      config_file: fake-gocart.yaml

  connections:
    - src_name: PLE
      src_comp: DataForSolar
      src_intent: internal
      dst_name: PLE
      dst_comp: SOLAR
    - src_name: T
      src_comp: DataForSolar
      src_intent: internal
      dst_name: T
      dst_comp: SOLAR
    - src_name: QV
      src_comp: DataForSolar
      src_intent: internal
      dst_name: QV
      dst_comp: SOLAR
    - src_name: QL
      src_comp: DataForSolar
      src_intent: internal
      dst_name: QL
      dst_comp: SOLAR
