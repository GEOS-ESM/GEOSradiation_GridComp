---
mapl:

  geometry:
    esmf_geom:
      class: CubedSphere
      im_world: 12
    vertical_grid:
      class: model
      standard_name: air_pressure
      units: hPa
      num_levels: 181
      field_edge: PLE
      field_center: PE

  children:
    DataIRRAD:
      dso: libconfigurable_gridcomp.so
      setservice: setservices_
      config_file: data-irrad.yaml

    IRRAD:
      dso: libGEOSradiation_GridComp.so
      setservice: irrad_setservices_
      config_file: irrad.yaml

    FakeGOCART:
      dso: libFakeGOCART_GridComp.so
      setservice: fakegocart_setservices_

  connections:
    - src_name: PLE
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: PLE
      dst_comp: IRRAD
    - src_name: T
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: T
      dst_comp: IRRAD
    - src_name: QV
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: QV # Q
      dst_comp: IRRAD
    - src_name: QL
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: QL
      dst_comp: IRRAD
    - src_name: QI
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: QI
      dst_comp: IRRAD
    - src_name: QR
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: QR
      dst_comp: IRRAD
    - src_name: QS
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: QS
      dst_comp: IRRAD
    - src_name: QG
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: QG
      dst_comp: IRRAD
    - src_name: RL
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: RL
      dst_comp: IRRAD
    - src_name: RI
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: RI
      dst_comp: IRRAD
    - src_name: RR
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: RR
      dst_comp: IRRAD
    - src_name: RS
      src_comp: DataIRRAD
      src_intent: internal
      dst_name: RS
      dst_comp: IRRAD
