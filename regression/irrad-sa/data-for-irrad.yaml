      CH4:
        units: pppv
        vertical_dim_spec: "c"
        standard_name: "methane_concentration"
      N2O:
        units: pppv
        vertical_dim_spec: "c"
        standard_name: "nitrous_oxide_concentration"
      CFC11:
        units: pppv
        vertical_dim_spec: "c"
        standard_name: "CFC11_concentration"
      CFC12:
        units: pppv
        vertical_dim_spec: "c"
        standard_name: "CFC12_concentration"
      HCFC22:
        units: pppv
        vertical_dim_spec: "c"
        standard_name: "HCFC22_concentration"
      FCLD:
        units: 1
        vertical_dim_spec: "c"
        standard_name: "cloud_area_fraction_in_atmosphere_layer"
      TS:
        units: K
        vertical_dim_spec: "n"
        standard_name: "surface_skin_temperature"
      EMIS:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "surface_emissivity"
      PREF:
        units: Pa
        dims: z
        vertical_dim_spec: "e"
        standard_name: "reference_air_pressure"
      TSINST:
        units: K
        vertical_dim_spec: "n"
        standard_name: "surface_skin_temperature_instantaneous"
