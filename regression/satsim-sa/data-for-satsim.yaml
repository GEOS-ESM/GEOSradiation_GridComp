mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp
    userRoutine: setservices_

  misc:
    restart:
      internal: true

  # SATSIM's 19 imports, restarted from the MAPL2 SATSIM import state.
  # Units and standard names are SatSim's own (Satsim_StateSpecs.rc),
  # kept as in MAPL2, so they match the baseline's import metadata.
  states:
    internal:
      T:
        units: K
        vertical_dim_spec: "c"
        standard_name: "air_temperature"
      QV:
        units: 1
        vertical_dim_spec: "c"
        standard_name: "specific_humidity"
      FCLD:
        units: 1
        vertical_dim_spec: "c"
        standard_name: "cloud_area_fraction"
      RL:
        units: m
        vertical_dim_spec: "c"
        standard_name: "liquid_cloud_particle_effective_radius"
      RI:
        units: m
        vertical_dim_spec: "c"
        standard_name: "ice_phase_cloud_particle_effective_radius"
      RG:
        units: m
        vertical_dim_spec: "c"
        standard_name: "graupel_particle_effective_radius"
      RS:
        units: m
        vertical_dim_spec: "c"
        standard_name: "snow_particle_effective_radius"
      RR:
        units: m
        vertical_dim_spec: "c"
        standard_name: "rain_cloud_particle_effective_radius"
      PLE:
        units: Pa
        vertical_dim_spec: "e"
        standard_name: "Edge_pressures"
      ZLE:
        units: m
        vertical_dim_spec: "e"
        standard_name: "Edge_heights"
      QL:
        units: 1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_cloud_liquid_water"
      QI:
        units: 1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_cloud_ice_water"
      QR:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_falling_rain"
      QS:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_falling_snow"
      QG:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_falling_graupel"
      TS:
        units: K
        vertical_dim_spec: "n"
        standard_name: "skin_temperature"
      MCOSZ:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "mean_cosine_of_the_solar_zenith_angle"
      FRLAND:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "fraction_of_land"
      FROCEAN:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "fraction_of_ocean"
