    - src_comp: <self>
      src_name: MCOSZ
      src_intent: internal
      dst_comp: <self>
      dst_name: MCOSZ
      dst_intent: export

    - src_comp: <self>
      src_name: FRLAND
      src_intent: internal
      dst_comp: <self>
      dst_name: FRLAND
      dst_intent: export

    - src_comp: <self>
      src_name: FROCEAN
      src_intent: internal
