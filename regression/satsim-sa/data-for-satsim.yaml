mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp
    userRoutine: setservices_

  misc:
    restart:
      internal: true

  # SATSIM's 19 imports, restarted from the MAPL2 SATSIM import state.
  # Units and standard names are SatSim's own (Satsim_StateSpecs.rc),
  # kept as in MAPL2, so they match the baseline's import metadata.
  states:
    internal:
      T:
        units: K
        vertical_dim_spec: "c"
        standard_name: "air_temperature"
      QV:
        units: 1
        vertical_dim_spec: "c"
        standard_name: "specific_humidity"
      FCLD:
        units: 1
        vertical_dim_spec: "c"
        standard_name: "cloud_area_fraction"
      RL:
        units: m
        vertical_dim_spec: "c"
        standard_name: "liquid_cloud_particle_effective_radius"
      RI:
        units: m
        vertical_dim_spec: "c"
        standard_name: "ice_phase_cloud_particle_effective_radius"
      RG:
        units: m
        vertical_dim_spec: "c"
        standard_name: "graupel_particle_effective_radius"
      RS:
        units: m
        vertical_dim_spec: "c"
        standard_name: "snow_particle_effective_radius"
      RR:
        units: m
        vertical_dim_spec: "c"
        standard_name: "rain_cloud_particle_effective_radius"
      PLE:
        units: Pa
        vertical_dim_spec: "e"
        standard_name: "Edge_pressures"
      ZLE:
        units: m
        vertical_dim_spec: "e"
        standard_name: "Edge_heights"
      QL:
        units: 1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_cloud_liquid_water"
      QI:
        units: 1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_cloud_ice_water"
      QR:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_falling_rain"
      QS:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_falling_snow"
      QG:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_falling_graupel"
      TS:
        units: K
        vertical_dim_spec: "n"
        standard_name: "skin_temperature"
      MCOSZ:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "mean_cosine_of_the_solar_zenith_angle"
      FRLAND:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "fraction_of_land"
      FROCEAN:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "fraction_of_ocean"

  connections:
    - src_comp: <self>
      src_name: T
      src_intent: internal
      dst_comp: <self>
      dst_name: T
      dst_intent: export

    - src_comp: <self>
      src_name: QV
      src_intent: internal
      dst_comp: <self>
      dst_name: QV
      dst_intent: export

    - src_comp: <self>
      src_name: FCLD
      src_intent: internal
      dst_comp: <self>
      dst_name: FCLD
      dst_intent: export

    - src_comp: <self>
      src_name: RL
      src_intent: internal
      dst_comp: <self>
      dst_name: RL
      dst_intent: export

    - src_comp: <self>
      src_name: RI
      src_intent: internal
      dst_comp: <self>
      dst_name: RI
      dst_intent: export

    - src_comp: <self>
      src_name: RG
      src_intent: internal
      dst_comp: <self>
      dst_name: RG
      dst_intent: export

    - src_comp: <self>
      src_name: RS
      src_intent: internal
      dst_comp: <self>
      dst_name: RS
      dst_intent: export

    - src_comp: <self>
      src_name: RR
      src_intent: internal
      dst_comp: <self>
      dst_name: RR
      dst_intent: export

    - src_comp: <self>
      src_name: PLE
      src_intent: internal
      dst_comp: <self>
      dst_name: PLE
      dst_intent: export

    - src_comp: <self>
      src_name: ZLE
      src_intent: internal
      dst_comp: <self>
      dst_name: ZLE
      dst_intent: export

    - src_comp: <self>
      src_name: QL
      src_intent: internal
      dst_comp: <self>
      dst_name: QL
      dst_intent: export

    - src_comp: <self>
      src_name: QI
      src_intent: internal
      dst_comp: <self>
      dst_name: QI
      dst_intent: export

    - src_comp: <self>
      src_name: QR
      src_intent: internal
      dst_comp: <self>
      dst_name: QR
      dst_intent: export

    - src_comp: <self>
      src_name: QS
      src_intent: internal
      dst_comp: <self>
