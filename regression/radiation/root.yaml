---
mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp
    userRoutine: setservices_

  geometry:
    esmf_geom:
      class: CubedSphere
      im_world: 12
    vertical_grid:
      grid_type: model
      fields: {pressure: PLE}
      num_levels: 181

  children:
    DataForRadiation:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-radiation.yaml

    FakeGOCART:
      dso: libFakeGOCART_GridComp.so
      setservices: fakegocart_setservices_
      config_file: fake-gocart.yaml

    RADIATION:
      dso: libGEOSradiation_GridComp.so
      setservices: radiation_setservices_
      config_file: radiation.yaml

  # IRRAD's and SOLAR's imports propagate up to RADIATION, so each name is
  # connected once and feeds every child that imports it.
  connections:
    - src_name: PLEINST
      src_comp: DataForRadiation
      src_intent: internal
      dst_name: PLEINST
      dst_comp: RADIATION
    - src_name: PLE
      src_comp: DataForRadiation
      src_intent: internal
      dst_name: PLE
      dst_comp: RADIATION
    - src_name: T
      src_comp: DataForRadiation
      src_intent: internal
      dst_name: T
      dst_comp: RADIATION
