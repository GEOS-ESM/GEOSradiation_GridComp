      ISCCP_SUBV5: {source: SATSIM.ISCCP_SUBV5}
      ISCCP_SUBV6: {source: SATSIM.ISCCP_SUBV6}
      ISCCP_SUBV7: {source: SATSIM.ISCCP_SUBV7}
      CLTISCCP: {source: SATSIM.CLTISCCP}
