mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp
    userRoutine: setservices_

  misc:
    restart:
      internal: true

  # RADIATION's external imports: its own PLEINST plus the union of IRRAD's,
  # SOLAR's and SATSIM's imports (same entries as data-for-irrad.yaml,
  # data-for-solar.yaml and data-for-satsim.yaml, minus SATSIM's MCOSZ,
  # which RADIATION connects from SOLAR). IRRAD and SOLAR only differ on
  # FCLD's standard name; Solar's cloud_area_fraction is used, so IRRAD's
  # FCLD import gets a standard_name warning. SATSIM declares its own
  # standard names (and units 1 for QV, QL, QI), so its shared imports get
  # standard_name warnings and a kg kg-1 -> 1 units conversion.
  states:
    internal:
      PLEINST:
        units: Pa
        vertical_dim_spec: "e"
        standard_name: "air_pressure"
      PLE:
        units: Pa
        vertical_dim_spec: "e"
        standard_name: "air_pressure"
      T:
        units: K
        vertical_dim_spec: "c"
        standard_name: "air_temperature"
      QV:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "specific_humidity"
      QL:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_cloud_liquid_water_in_air"
      QI:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_cloud_ice_in_air"
      QR:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_rain_water_in_air"
      QS:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_snow_in_air"
      QG:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "mass_fraction_of_graupel_in_air"
      RL:
        units: m
        vertical_dim_spec: "c"
        standard_name: "effective_radius_of_cloud_liquid_water_particles"
      RI:
        units: m
        vertical_dim_spec: "c"
        standard_name: "effective_radius_of_cloud_ice_particles"
      RR:
        units: m
        vertical_dim_spec: "c"
        standard_name: "effective_radius_of_rain_particles"
      RS:
        units: m
        vertical_dim_spec: "c"
        standard_name: "effective_radius_of_snow_particles"
      RG:
        units: m
        vertical_dim_spec: "c"
        standard_name: "effective_radius_of_graupel_particles"
      O3:
        units: kg kg-1
        vertical_dim_spec: "c"
        standard_name: "ozone_mass_mixing_ratio"
      CH4:
        units: pppv
        vertical_dim_spec: "c"
        standard_name: "methane_concentration"
      N2O:
        units: pppv
        vertical_dim_spec: "c"
        standard_name: "nitrous_oxide_concentration"
      CFC11:
        units: pppv
        vertical_dim_spec: "c"
        standard_name: "CFC11_concentration"
      CFC12:
        units: pppv
        vertical_dim_spec: "c"
        standard_name: "CFC12_concentration"
      HCFC22:
        units: pppv
        vertical_dim_spec: "c"
        standard_name: "HCFC22_concentration"
      FCLD:
        units: 1
        vertical_dim_spec: "c"
        standard_name: "cloud_area_fraction"
      TS:
        units: K
        vertical_dim_spec: "n"
        standard_name: "surface_skin_temperature"
      EMIS:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "surface_emissivity"
      PREF:
        units: Pa
        dims: z
        vertical_dim_spec: "e"
        standard_name: "reference_air_pressure"
      TSINST:
        units: K
        vertical_dim_spec: "n"
        standard_name: "surface_skin_temperature_instantaneous"
      ALBVR:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "surface_albedo_for_visible_beam"
      ALBVF:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "surface_albedo_for_visible_diffuse"
      ALBNR:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "surface_albedo_for_near_infrared_beam"
      ALBNF:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "surface_albedo_for_near_infrared_diffuse"
      # SATSIM-only imports, with SatSim's own units and standard names
      ZLE:
        units: m
        vertical_dim_spec: "e"
        standard_name: "Edge_heights"
      FRLAND:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "fraction_of_land"
      FROCEAN:
        units: 1
        vertical_dim_spec: "n"
        standard_name: "fraction_of_ocean"
      # AERO comes from FakeGOCART (see root.yaml connections)

  connections:
    - src_comp: <self>
      src_name: PLEINST
      src_intent: internal
      dst_comp: <self>
      dst_name: PLEINST
      dst_intent: export

    - src_comp: <self>
      src_name: PLE
      src_intent: internal
      dst_comp: <self>
